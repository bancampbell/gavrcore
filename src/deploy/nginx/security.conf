# SECURITY (docs/SECURITY.md B2/B3): шаблон nginx-сервера для прода —
# подключается при деплое клиентского сайта, в dev не использовать
# (dev — HTTP без TLS: docker/nginx/default.conf, редирект и HSTS ломали бы его).

server {
    listen 80;
    server_name _;

    # B2: редирект 80→443
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com; # TODO: домен клиентского сайта

    # TLS 1.2+ (сертификаты — например, certbot):
    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # B2: HSTS (в dev не включать — localhost без TLS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # B3: не светить версию nginx
    server_tokens off;

    root /var/www/public;
    index index.php;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # B3: загруженные пользовательские файлы — только статика, PHP не исполняется
    location ^~ /storage/ {
        location ~* \.php$ {
            deny all;
        }
    }

    location ~ \.php$ {
        fastcgi_pass app:9000; # upstream php-fpm при деплое может отличаться
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
